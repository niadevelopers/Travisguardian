<!DOCTYPE html>
<html>
<body>

  
  <a href="https://travis-three.vercel.app/travis_core.html" target="_top">Test link</a>
  <!-- A: new tab, referrer sent -->
<a href="https://travis-three.vercel.app" target="_blank">A: new tab</a><br>

<!-- B: new tab, no referrer -->
<a href="https://travis-three.vercel.app" target="_blank" rel="noreferrer">B: new tab, no referrer</a><br>

<!-- C: same tab, leaves your site entirely -->
<a href="https://travis-three.vercel.app">C: same tab</a><br>

<!-- D: script-opened tab -->
<button onclick="window.open('https://travis-three.vercel.app', '_blank')">D: window.open</button><br>

<!-- E: redirect through your own server (make /go/travis a 302 to the app) -->
<a href="/go/travis" target="_blank">E: via your redirect</a>


  
</body>
</html>
