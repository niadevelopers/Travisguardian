<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Offline — Travis Guardian</title>
  <meta name="theme-color" content="#0B1F3A" />
  <style>
    :root {
      --navy: #0B1F3A; --navy-soft: #13294B;
      --teal: #0FB5A6; --green: #1FA971;
      --text-muted: #5A6B85; --border: #E4E9F0;
      --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: var(--font);
      background: linear-gradient(180deg, #FFFFFF 0%, #F6F8FB 100%);
      min-height: 100vh; display: grid; place-items: center;
      padding: 24px; color: #0F172A; line-height: 1.6;
      -webkit-font-smoothing: antialiased;
    }
    .card {
      max-width: 460px; width: 100%;
      background: #fff; border: 1px solid var(--border);
      border-radius: 20px; padding: 44px 32px;
      text-align: center;
      box-shadow: 0 20px 48px rgba(15,23,42,.10);
    }
    .brand {
      display: inline-flex; align-items: center; gap: 10px;
      font-weight: 800; font-size: 17px; color: var(--navy);
      margin-bottom: 28px;
    }
    .brand-mark {
      width: 30px; height: 30px; border-radius: 8px;
      background: linear-gradient(135deg, var(--teal), var(--green));
      display: grid; place-items: center;
      color: #fff; font-weight: 800; font-size: 14px;
    }
    .icon { font-size: 52px; margin-bottom: 18px; }
    h1 {
      font-size: 24px; color: var(--navy);
      letter-spacing: -.02em; margin-bottom: 12px; font-weight: 800;
    }
    p { color: var(--text-muted); font-size: 15px; margin-bottom: 10px; }
    .btn {
      display: inline-flex; align-items: center; gap: 8px;
      padding: 13px 22px; border-radius: 12px;
      background: var(--navy); color: #fff; font-weight: 700;
      font-size: 15px; text-decoration: none; margin-top: 22px;
      transition: background .15s ease;
    }
    .btn:hover { background: var(--navy-soft); }
  </style>
</head>
<body>
  <div class="card">
    <div class="brand">
      <span class="brand-mark">TG</span>
      <span>Travis Guardian</span>
    </div>
    <div class="icon">📵</div>
    <h1>You're offline.</h1>
    <p>This page hasn't been cached yet, and you don't have an internet connection.</p>
    <p>Reconnect and try again — after one visit, every page works offline.</p>
    <a href="./index.html" class="btn">Try again →</a>
  </div>
  <script>
    window.addEventListener('online', () => {
      window.location.href = './index.html';
    });
  </script>
</body>
</html>
