<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Opening TRAVIS…</title>
  <meta http-equiv="refresh" content="0; url=https://travis-three.vercel.app">
  <script>location.replace("https://travis-three.vercel.app");</script>
</head>
<body>
  <p>Opening TRAVIS… <a href="https://travis-three.vercel.app">Click here if nothing happens</a></p>

  <script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('sw.js', { scope: './' })
        .then((reg) => console.log('[SW] Registered. Scope:', reg.scope))
        .catch((err) => console.warn('[SW] Registration failed:', err));
    });
  }
</script>
</body>
</html>
